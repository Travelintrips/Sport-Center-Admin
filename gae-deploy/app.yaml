runtime: nodejs20
service: default

# Entrypoint — compiled ESM bundle; PORT is injected by App Engine automatically
entrypoint: node --enable-source-maps ./dist/index.mjs

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
  max_concurrent_requests: 80

# Non-secret, non-sensitive env vars only.
# All secrets (DB, auth, storage, API keys) must be set via
# Google Secret Manager or gcloud app deploy --set-env-vars — NOT here.
env_variables:
  NODE_ENV: "production"
  VITE_PUBLIC_URL: "https://sc.travelintrips.co.id"
