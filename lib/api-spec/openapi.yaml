  /admin/expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses with filters and summary
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
        - in: query
          name: endDate
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: vendorName
          schema:
            type: string
        - in: query
          name: facilityId
          schema:
            type: integer
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListResult"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense (draft)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /admin/expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get expense detail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseDetail"
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update expense (only draft/rejected)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /admin/expenses/{id}/status:
    patch:
      operationId: updateExpenseStatus
      tags: [expenses]
      summary: Change expense status (submit/approve/reject/pay/cancel)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseStatusInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /admin/document-templates:
    get:
      operationId: listDocumentTemplates
      tags: [document-templates]
      summary: List document templates with optional filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: companyId
          schema:
            type: string
        - in: query
          name: documentType
          schema:
            type: string
      responses:
        "200":
          description: List of document templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentTemplate"
    post:
      operationId: createDocumentTemplate
      tags: [document-templates]
      summary: Create a new document template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"

  /admin/document-templates/{id}:
    get:
      operationId: getDocumentTemplate
      tags: [document-templates]
      summary: Get a document template by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
    put:
      operationId: updateDocumentTemplate
      tags: [document-templates]
      summary: Update a document template
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
    delete:
      operationId: deleteDocumentTemplate
      tags: [document-templates]
      summary: Delete a document template (non-default only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/documents/{documentType}/{entityId}/preview:
    get:
      operationId: previewDocument
      tags: [document-templates]
      summary: Render document as HTML preview (no number issuance)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentType
          required: true
          schema:
            type: string
            enum: [invoice, spp, faktur, kwitansi, lampiran, berita_acara]
        - in: path
          name: entityId
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          schema:
            type: integer
        - in: query
          name: _token
          description: JWT token for browser window.open() flows (alternative to Authorization header)
          schema:
            type: string
      responses:
        "200":
          description: HTML document preview
          content:
            text/html:
              schema:
                type: string

  /admin/documents/{documentType}/{entityId}/pdf:
    get:
      operationId: generateDocumentPdf
      tags: [document-templates]
      summary: Generate PDF binary (Puppeteer) or print-ready HTML fallback; issues document number
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentType
          required: true
          schema:
            type: string
            enum: [invoice, spp, faktur, kwitansi, lampiran, berita_acara]
        - in: path
          name: entityId
          required: true
          schema:
            type: integer
        - in: query
          name: companyId
          schema:
            type: integer
        - in: query
          name: _token
          description: JWT token for browser window.open() flows (alternative to Authorization header)
          schema:
            type: string
      responses:
        "200":
          description: PDF binary (application/pdf) or HTML fallback (text/html)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GoogleLoginInput:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    SendOtpInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    VerifyOtpInput:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string
        name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, super_admin, admin_booking, finance, staff, customer, tenant, ap2_employee]
        phone:
          type: ["string", "null"]
        googleId:
          type: ["string", "null"]
        hasPassword:
          type: boolean
        createdAt:
          type: string

    Facility:
      type: object
      required: [id, name, category, pricePerHour, openTime, closeTime, isActive, bookingMode]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        bookingMode:
          type: string
          enum: [time_slot, walk_in]
        minDuration:
          type: integer
        maxDuration:
          type: ["integer", "null"]
        capacity:
          type: ["integer", "null"]
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/FacilityImage"
        createdAt:
          type: string

    FacilityImage:
      type: object
      required: [id, facilityId, url, isPrimary]
      properties:
        id:
          type: integer
        facilityId:
          type: integer
        url:
          type: string
        isPrimary:
          type: boolean

    FacilityInput:
      type: object
      required: [name, category, pricePerHour, openTime, closeTime]
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        minDuration:
          type: integer
        maxDuration:
          type: integer
        capacity:
          type: integer
        isActive:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string

    FacilityUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        minDuration:
          type: integer
        maxDuration:
          type: integer
        capacity:
          type: integer
        isActive:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string

    TimeSlot:
      type: object
      required: [time, available]
      properties:
        time:
          type: string
        available:
          type: boolean
        reason:
          type: ["string", "null"]

    Booking:
      type: object
      required: [id, orderNumber, customerName, customerEmail, customerPhone, facilityId, facilityName, bookingDate, startTime, endTime, durationHours, totalPrice, status]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        facilityId:
          type: integer
        facilityName:
          type: string
        facilityCategory:
          type: string
        bookingDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        durationHours:
          type: integer
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending_payment, waiting_confirmation, paid, confirmed, completed, cancelled, rejected, expired, refunded]
        customerType:
          type: string
          enum: [umum, angkasa_pura]
        idCardNumber:
          type: ["string", "null"]
        verificationStatus:
          type: string
          enum: [not_required, pending, verified, rejected]
        basePrice:
          type: ["number", "null"]
        apDiscountAmount:
          type: number
        activityType:
          type: ["string", "null"]
        numberOfPeople:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        adminNotes:
          type: ["string", "null"]
        whatsappMessage:
          type: ["string", "null"]
        checkedInAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        paymentDeadline:
          type: ["string", "null"]
        ppnRate:
          type: ["number", "null"]
        ppnAmount:
          type: ["number", "null"]
        grandTotal:
          type: ["number", "null"]
        downPayment:
          type: number
        isDpPaid:
          type: boolean
        payment:
          $ref: "#/components/schemas/Payment"
          nullable: true
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        remainingAmount:
          type: number
        createdAt:
          type: string

    DpPaymentInput:
      type: object
      required: [downPaymentAmount]
      properties:
        downPaymentAmount:
          type: number
          minimum: 0

    RecurringBookingCheckInput:
      type: object
      required: [facilityId, startDate, startTime, durationHours, repeatType, repeatCount]
      properties:
        facilityId:
          type: integer
        startDate:
          type: string
        startTime:
          type: string
        durationHours:
          type: integer
        repeatType:
          type: string
          enum: [weekly, monthly]
        repeatCount:
          type: integer
          minimum: 1
          maximum: 52

    RecurringDateStatus:
      type: object
      required: [date, available]
      properties:
        date:
          type: string
        available:
          type: boolean
        reason:
          type: ["string", "null"]

    RecurringBookingCheckResult:
      type: object
      required: [dates, pricePerSession, validCount, totalPrice]
      properties:
        dates:
          type: array
          items:
            $ref: "#/components/schemas/RecurringDateStatus"
        pricePerSession:
          type: number
        validCount:
          type: integer
        totalPrice:
          type: number

    RecurringBookingInput:
      type: object
      required: [customerName, customerEmail, customerPhone, facilityId, startDate, startTime, durationHours, repeatType, repeatCount]
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        facilityId:
          type: integer
        startDate:
          type: string
        startTime:
          type: string
        durationHours:
          type: integer
        repeatType:
          type: string
          enum: [weekly, monthly]
        repeatCount:
          type: integer
        notes:
          type: string

        downPaymentAmount:
          type: number
          description: Total down payment for the recurring payment group. Must be less than the group grand total.

        customerType:
          type: string
          enum: [umum, angkasa_pura]
        idCardNumber:
          type: string

    RecurringBookingResult:
      type: object
      required: [created, skipped, totalBookings, grandTotal]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        skipped:
          type: array
          items:
            type: string
        totalBookings:
          type: integer
        grandTotal:
          type: number

    Vendor:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    VendorSimple:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    BookingInput:
      type: object
      required: [customerName, customerEmail, customerPhone, facilityId, bookingDate]
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        facilityId:
          type: integer
        bookingDate:
          type: string
        startTime:
          type: string
        durationHours:
          type: integer
        activityType:
          type: string
        numberOfPeople:
          type: integer
        customerType:
          type: string
          enum: [umum, angkasa_pura]
        idCardNumber:
          type: string
        notes:
          type: string
        vendorId:
          type: integer
          nullable: true

    BookingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending_payment, waiting_confirmation, paid, confirmed, completed, cancelled, rejected, expired, refunded]
        adminNotes:
          type: string

    Payment:
      type: object
      required: [id, bookingId, amount, providerName, providerId, providerOrderId, bankAccountId, status]
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        amount:
          type: number
        proofUrl:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
        paymentProvider:
          type: ["string", "null"]
          enum: [mandiri_direct, paylabs, unknown, null]
        providerName:
          type: string
        providerId:
          type: string
        providerOrderId:
          type: string
        bankAccountId:
          type: string
        providerReference:
          type: ["string", "null"]
        merchantTradeNo:
          type: ["string", "null"]
        providerTradeNo:
          type: ["string", "null"]
        paymentType:
          type: string
          enum: [dp, pelunasan, full_payment]
        status:
          type: string
          enum: [pending, confirmed, rejected]
        confirmedAt:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PaymentInput:
      type: object
      required: [bookingId, amount]
      properties:
        bookingId:
          type: integer
        amount:
          type: number
        proofUrl:
          type: string
        paymentMethod:
          type: string
          enum: [Transfer Bank, QRIS]
        paymentProvider:
          type: string
          enum: [mandiri_direct, paylabs, unknown]
        providerOrderId:
          type: string
        paymentType:
          type: string
          enum: [dp, pelunasan, full_payment]
        notes:
          type: string

    PaymentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, rejected]
        paymentMethod:
          type: string
