openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sport Center API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: facilities
    description: Facility management
  - name: bookings
    description: Booking management
  - name: payments
    description: Payment management
  - name: promos
    description: Promo and event management
  - name: schedules
    description: Blocked schedule management
  - name: customers
    description: Customer management
  - name: dashboard
    description: Admin dashboard
  - name: settings
    description: App settings
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: memberships
    description: Gym monthly membership management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /my-bookings:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: Get bookings for the currently logged-in customer
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Not authenticated

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /facilities:
    get:
      operationId: listFacilities
      tags: [facilities]
      summary: List all facilities
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Facility"
    post:
      operationId: createFacility
      tags: [facilities]
      summary: Create a facility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"

  /facilities/{id}:
    get:
      operationId: getFacility
      tags: [facilities]
      summary: Get a facility by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Facility detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "404":
          description: Not found
    patch:
      operationId: updateFacility
      tags: [facilities]
      summary: Update a facility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
    delete:
      operationId: deleteFacility
      tags: [facilities]
      summary: Delete a facility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /availability:
    get:
      operationId: checkAvailability
      tags: [facilities]
      summary: Get availability slots for a facility on a date
      parameters:
        - name: facilityId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: integer
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Time slot conflict

  /bookings/recurring/check:
    post:
      operationId: checkRecurringBooking
      tags: [bookings]
      summary: Check availability for recurring booking dates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringBookingCheckInput"
      responses:
        "200":
          description: Availability result for each date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBookingCheckResult"

  /bookings/recurring:
    post:
      operationId: createRecurringBooking
      tags: [bookings]
      summary: Create multiple bookings (recurring)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringBookingInput"
      responses:
        "201":
          description: Bookings created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBookingResult"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/order/{orderNumber}:
    get:
      operationId: getBookingByOrder
      tags: [bookings]
      summary: Get booking by order number (for customers)
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - name: bookingId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Upload payment proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update payment status (admin confirm/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /promos:
    get:
      operationId: listPromos
      tags: [promos]
      summary: List promos/events
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of promos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promo"
    post:
      operationId: createPromo
      tags: [promos]
      summary: Create a promo/event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promo"

  /promos/{id}:
    patch:
      operationId: updatePromo
      tags: [promos]
      summary: Update a promo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promo"
    delete:
      operationId: deletePromo
      tags: [promos]
      summary: Delete a promo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /promos/register:
    post:
      operationId: registerPromo
      tags: [promos]
      summary: Customer registration for a promo/event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoRegistrationInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoRegistration"

  /blocked-schedules:
    get:
      operationId: listBlockedSchedules
      tags: [schedules]
      summary: List blocked schedules
      parameters:
        - name: facilityId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of blocked schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedSchedule"
    post:
      operationId: createBlockedSchedule
      tags: [schedules]
      summary: Block a schedule slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockedScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedSchedule"

  /blocked-schedules/{id}:
    delete:
      operationId: deleteBlockedSchedule
      tags: [schedules]
      summary: Remove a blocked schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer detail with booking history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /admin/dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/bookings/export:
    get:
      operationId: exportBookings
      tags: [dashboard]
      summary: Export bookings as CSV
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV data
          content:
            text/csv:
              schema:
                type: string

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary

  /memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List all gym memberships (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, cancelled]
      responses:
        "200":
          description: List of memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymMembership"
    post:
      operationId: createMembership
      tags: [memberships]
      summary: Register a new gym membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymMembershipInput"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymMembership"

  /memberships/{id}:
    get:
      operationId: getMembership
      tags: [memberships]
      summary: Get membership detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymMembership"
    patch:
      operationId: updateMembership
      tags: [memberships]
      summary: Update membership (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymMembershipUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymMembership"
    delete:
      operationId: deleteMembership
      tags: [memberships]
      summary: Delete membership (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app settings
      responses:
        "200":
          description: App settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /discount-settings:
    get:
      operationId: listDiscountSettings
      tags: [discounts]
      summary: List discount settings per customer type
      responses:
        "200":
          description: List of discount settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscountSetting"

  /discount-settings/{customerType}:
    get:
      operationId: getDiscountSetting
      tags: [discounts]
      summary: Get discount setting for a customer type
      parameters:
        - name: customerType
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discount setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountSetting"
        "404":
          description: Not found
    patch:
      operationId: updateDiscountSetting
      tags: [discounts]
      summary: Update discount percentage and active state (admin)
      parameters:
        - name: customerType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountSettingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountSetting"

  /ap-members:
    get:
      operationId: listApMembers
      tags: [ap-members]
      summary: List Angkasa Pura members (admin)
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApMember"
    post:
      operationId: createApMember
      tags: [ap-members]
      summary: Add an Angkasa Pura member (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApMember"

  /ap-members/{id}:
    patch:
      operationId: updateApMember
      tags: [ap-members]
      summary: Update an Angkasa Pura member (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApMember"
    delete:
      operationId: deleteApMember
      tags: [ap-members]
      summary: Delete an Angkasa Pura member (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /bookings/{id}/verify:
    post:
      operationId: verifyBooking
      tags: [bookings]
      summary: Verify Angkasa Pura ID card and apply discount (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, customer]
        phone:
          type: ["string", "null"]
        createdAt:
          type: string

    Facility:
      type: object
      required: [id, name, category, pricePerHour, openTime, closeTime, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        minDuration:
          type: integer
        maxDuration:
          type: ["integer", "null"]
        capacity:
          type: ["integer", "null"]
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/FacilityImage"
        createdAt:
          type: string

    FacilityImage:
      type: object
      required: [id, facilityId, url, isPrimary]
      properties:
        id:
          type: integer
        facilityId:
          type: integer
        url:
          type: string
        isPrimary:
          type: boolean

    FacilityInput:
      type: object
      required: [name, category, pricePerHour, openTime, closeTime]
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        minDuration:
          type: integer
        maxDuration:
          type: integer
        capacity:
          type: integer
        isActive:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string

    FacilityUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        pricePerHour:
          type: number
        openTime:
          type: string
        closeTime:
          type: string
        minDuration:
          type: integer
        maxDuration:
          type: integer
        capacity:
          type: integer
        isActive:
          type: boolean
        imageUrls:
          type: array
          items:
            type: string

    TimeSlot:
      type: object
      required: [time, available]
      properties:
        time:
          type: string
        available:
          type: boolean
        reason:
