            application/json:
              schema:
                $ref: "#/components/schemas/BankMutationCandidatesResult"

  /bank-reconciliation/mutations/{id}/approve-candidate:
    post:
      operationId: approveBankMutationCandidate
      tags: [bank-reconciliation]
      summary: Approve a specific match candidate for a mutation
      parameters:
        - in: path
