openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sport Center API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: company-verifications
    description: Employee verification for corporate billing
  - name: auth
    description: Authentication
  - name: facilities
    description: Facility management
  - name: bookings
    description: Booking management
  - name: payments
    description: Payment management
  - name: promos
    description: Promo and event management
  - name: schedules
    description: Blocked schedule management
  - name: customers
    description: Customer management
  - name: dashboard
    description: Admin dashboard
  - name: settings
    description: App settings
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: company-billing
    description: Company customer billing and monthly invoices
  - name: memberships
    description: Gym monthly membership management
  - name: tenants
    description: Tenant (Penyewa Tenan) management
  - name: tax
    description: Tax settings and tax reporting (PPN)
  - name: bank-reconciliation
    description: Bank mutation import and reconciliation matching
  - name: expenses
    description: Operational expense management
  - name: document-templates
    description: Company document template management (invoice, SPP, faktur, kwitansi, etc.)
paths:
  /admin/facility-company-mappings:
    get:
      operationId: listFacilityCompanyMappings
      tags: [facilities]
      summary: List effective-dated facility ownership mappings
      parameters:
        - name: facilityId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ownership mappings
    post:
      operationId: createFacilityCompanyMapping
      tags: [facilities]
      summary: Create an effective-dated facility ownership mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityId, companyId, effectiveFrom]
              properties:
                facilityId: { type: integer }
                companyId: { type: integer }
                effectiveFrom: { type: string, format: date }
                effectiveUntil: { type: string, format: date, nullable: true }
                isActive: { type: boolean }
                source: { type: string }
                notes: { type: string, nullable: true }
      responses:
        "201":
          description: Mapping created
  /admin/facility-company-mappings/{id}:
    patch:
      operationId: updateFacilityCompanyMapping
      tags: [facilities]
      summary: Deactivate or supersede an ownership mapping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
                effectiveUntil: { type: string, format: date, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Mapping updated
  /admin/audit-sport-center-payments/13-14-dry-run:
    get:
      operationId: auditSportCenterPayments1314DryRun
      tags: [payments]
      summary: Dry-run repair readiness for payments 13 and 14
      responses:
        "200":
          description: Read-only repair report
  /admin/audit-sport-center-ownership/dry-run:
    get:
      operationId: auditSportCenterOwnershipDryRun
      tags: [payments]
      summary: Dry-run historical ownership classifier
      responses:
        "200":
          description: Read-only ownership classification

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered

  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [auth]
      summary: Login or register with Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Google token

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send OTP via WhatsApp to phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid phone number

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired OTP

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /my-bookings:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: Get bookings for the currently logged-in customer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyBookingItem"
        "401":
          description: Not authenticated

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/profile:
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "401":
          description: Not authenticated

  /auth/link-google:
    post:
      operationId: linkGoogle
      tags: [auth]
      summary: Link Google account to current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginInput"
      responses:
        "200":
          description: Google account linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated or invalid token
        "409":
          description: Google account already linked to another user

  /facilities:
    get:
      operationId: listFacilities
      tags: [facilities]
      summary: List all facilities
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Facility"
    post:
      operationId: createFacility
      tags: [facilities]
      summary: Create a facility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"

  /facilities/{id}:
    get:
      operationId: getFacility
      tags: [facilities]
      summary: Get a facility by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Facility detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "404":
          description: Not found
    patch:
      operationId: updateFacility
      tags: [facilities]
      summary: Update a facility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
    delete:
      operationId: deleteFacility
      tags: [facilities]
      summary: Delete a facility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /availability:
    get:
      operationId: checkAvailability
      tags: [facilities]
      summary: Get availability slots for a facility on a date
      parameters:
        - name: facilityId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List active vendors (public dropdown)
      responses:
        "200":
          description: List of active vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorSimple"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: integer
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Time slot conflict

  /bookings/recurring/check:
    post:
      operationId: checkRecurringBooking
      tags: [bookings]
      summary: Check availability for recurring booking dates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringBookingCheckInput"
      responses:
        "200":
          description: Availability result for each date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBookingCheckResult"

  /bookings/recurring:
    post:
      operationId: createRecurringBooking
      tags: [bookings]
      summary: Create multiple bookings (recurring)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringBookingInput"
      responses:
        "201":
          description: Bookings created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBookingResult"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/dp:
    patch:
      operationId: payBookingDp
      tags: [bookings]
      summary: Set down payment for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DpPaymentInput"
      responses:
        "200":
          description: DP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid DP amount
        "404":
          description: Not found

  /bookings/order/{orderNumber}:
    get:
      operationId: getBookingByOrder
      tags: [bookings]
      summary: Get booking by order number (for customers)
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - name: bookingId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Upload payment proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update payment status (admin confirm/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}/metadata:
    patch:
      operationId: updatePaymentMetadata
      tags: [payments]
      summary: Update payment metadata only (method/provider) without financial side effects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMetadataUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /promos:
    get:
      operationId: listPromos
      tags: [promos]
      summary: List promos/events
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of promos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promo"
    post:
      operationId: createPromo
      tags: [promos]
      summary: Create a promo/event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promo"

  /promos/{id}:
    patch:
      operationId: updatePromo
      tags: [promos]
      summary: Update a promo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promo"
    delete:
      operationId: deletePromo
      tags: [promos]
      summary: Delete a promo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /promos/register:
    post:
      operationId: registerPromo
      tags: [promos]
      summary: Customer registration for a promo/event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoRegistrationInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoRegistration"

  /blocked-schedules:
    get:
      operationId: listBlockedSchedules
      tags: [schedules]
      summary: List blocked schedules
      parameters:
        - name: facilityId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of blocked schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedSchedule"
    post:
      operationId: createBlockedSchedule
      tags: [schedules]
      summary: Block a schedule slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockedScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedSchedule"

  /blocked-schedules/{id}:
    delete:
      operationId: deleteBlockedSchedule
      tags: [schedules]
      summary: Remove a blocked schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: accountType
          in: query
          schema:
            type: string
            enum: [personal, company]
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Email already exists

  /customers/sheets/connect:
    post:
      operationId: connectCustomerSheet
      tags: [customers]
      summary: Verify Google Sheet access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetConnectInput"
      responses:
        "200":
          description: Sheet accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetConnectResult"
        "400":
          description: Sheet not accessible or invalid

  /customers/sheets/push:
    post:
      operationId: pushCustomersToSheet
      tags: [customers]
      summary: Export all customers to Google Sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetSyncInput"
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetPushResult"
        "400":
          description: Sheet error

  /customers/sheets/pull:
    post:
      operationId: pullCustomersFromSheet
      tags: [customers]
      summary: Import customer updates from Google Sheet to DB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetSyncInput"
      responses:
        "200":
          description: Pull result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetPullResult"
        "400":
          description: Sheet error

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer detail with booking history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer account (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /companies:
    get:
      operationId: listCompanies
      tags: [company-verifications]
      summary: List company accounts available for employee verification
      responses:
        "200":
          description: List of company accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    companyName:
                      type: string

  /company-verifications:
    get:
      operationId: listCompanyVerifications
      tags: [company-verifications]
      summary: List all company verification requests (admin)
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: companyId
          schema:
            type: integer
      responses:
        "200":
          description: List of verifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyVerification"
    post:
      operationId: createCompanyVerification
      tags: [company-verifications]
      summary: Submit employee verification request (customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyVerificationRequest"
      responses:
        "201":
          description: Verification request submitted
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /company-verifications/my:
    get:
      operationId: listMyCompanyVerifications
      tags: [company-verifications]
      summary: Get current customer's verification requests
      responses:
        "200":
          description: My verifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyVerification"

