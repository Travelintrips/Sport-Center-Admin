name: Admin Lapangan DEV authenticated read-only smoke

on:
  pull_request:
    paths:
      - '.github/workflows/admin-booking-dev-readonly-smoke.yml'
      - 'artifacts/api-server/src/routes/__tests__/adminBookingDevReadonlySmoke.test.ts'
      - 'artifacts/api-server/src/routes/bookings.ts'
      - 'artifacts/api-server/src/routes/waBookingsAdmin.ts'
      - 'artifacts/api-server/src/services/x904NonmemberDailyAccessWorker.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-auth-get:
    name: Validate DEV admin_booking API access (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      APP_ENV: development
      DB_POOL_MAX: '1'
      ADMIN_BOOKING_DEV_READONLY_SMOKE: enabled
      SUPABASE_DATABASE_URL_DEV: ${{ secrets.SUPABASE_DATABASE_URL_DEV }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET_TEST }}
      GYM_X904_NONMEMBER_ACCESS_ENABLED: 'false'
      GYM_X904_MANUAL_ACCESS_ENABLED: 'false'
      GYM_X904_USER_WRITE_ENABLED: 'false'
      GYM_X904_AUTOMATIC_COMMANDS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Reject missing or incorrect DEV connection without printing secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DATABASE_URL_DEV"
          [[ "$SUPABASE_DATABASE_URL_DEV" == *xssrfshdrtdfupgqwfdw* ]]
          [[ "$SUPABASE_DATABASE_URL_DEV" != *nzdweipzckfszczzqtuw* ]]
          test -n "$SESSION_SECRET"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - name: Verify public HTTPS DEV staging access gate (external runner)
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 8 --max-time 20 https://dev.cstlogistic.co.id:8443/)
          if [ "$status" != "401" ]; then
            echo "::error::Sport Center DEV HTTPS staging unavailable or unauthenticated ($status)"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --connect-timeout 8 --max-time 20 https://dev.cstlogistic.co.id/
          echo "PUBLIC_SC_DEV_HTTPS_GATE_PASS"
      - name: Exercise authenticated Admin Lapangan GET using read-only PostgreSQL
        run: pnpm --filter @workspace/api-server exec jest --runInBand src/routes/__tests__/adminBookingDevReadonlySmoke.test.ts
