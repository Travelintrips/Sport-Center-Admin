name: SC Admin DEV bootstrap encrypted secret transfer
on:
  pull_request:
    paths:
      - '.github/workflows/sc-admin-dev-secret-package.yml'
permissions:
  contents: read
jobs:
  encrypt-only-dev-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
    steps:
      - name: DEV-only encrypted storage key (never plaintext)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEV_STORAGE_KEY:-}" ]; then
            echo "::error::DEV_STORAGE_SECRET_NOT_CONFIGURED"
            exit 1
          fi
          cat > /tmp/scdev-public.pem <<'PUBLIC'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvycx0XEayydL7Cm0otaD
          Z5X7+Th7AcPeWHn0d04JSEdRFfWc7Q5rCfMsq9nNKtIoQ2cguZhHTEtts6fE6qGD
          4wMG3tDckoru2dY01SLUJMf8r8BUStv4dcL8ml9/Zym2W+Mk58DkPPDdn3JbPrUI
          aRjkrRj17xuE3B2PGdqMCwcPsDS3kDcJBPNC4yQNRGGErSw3TWCNcQR98k7jHWEV
          pZ0cO6AP65AFxcm3JCaMJS+F1FxK+sbLcP3RnBqfXiscIWNgrnpRzkHbrzbSd/yp
          sffzB4j9e4+ckhOaNRG8B0iCMRP2GuSCg8zjiT/XYF2YaUERB3fBDkpyTXbWjKCO
          /XPrjN3Zw4G3nHEX69s8naR/aXnVo4ZiORz0lmeVR3chBCkqpHidGiiHBEj9vIQF
          dyOaOT0hBTKPLKV0fGY1DrhhB0oS/hOE0SfMAKvS1Vea4CfBgF7eIGqWJMkMv2P0
          jHkD+44owc58HR0Wt/6WLgqNXp+9Hg4NLGD/afZs+eizAgMBAAE=
          -----END PUBLIC KEY-----
PUBLIC
          printf '%s' "$DEV_STORAGE_KEY" > /tmp/scdev-secret.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/scdev-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/scdev-secret.bin -out /tmp/scdev-secret.enc
          echo SC_ADMIN_DEV_ENCRYPTED_BEGIN
          base64 -w0 /tmp/scdev-secret.enc
          echo
          echo SC_ADMIN_DEV_ENCRYPTED_END
          rm -f /tmp/scdev-secret.bin /tmp/scdev-secret.enc /tmp/scdev-public.pem
