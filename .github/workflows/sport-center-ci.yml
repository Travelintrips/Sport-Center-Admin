name: Sport Center CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_TEST }}
      GCP_SECRET_ID: sport-center-test
      SUPABASE_DATABASE_URL_DEV: ${{ secrets.SUPABASE_DATABASE_URL_DEV }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deprecated dependency chain
        run: |
          echo "=== node-fetch ==="
          pnpm why node-fetch || true

          echo "=== whatwg-url ==="
          pnpm why whatwg-url || true

          echo "=== tr46 ==="
          pnpm why tr46 || true

      - name: Trace punycode dependency
        run: |
          echo "=== TRACE TESSERACT ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('tesseract.js'); console.log('tesseract loaded')"

          echo "=== TRACE GOOGLE CLOUD STORAGE ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('@google-cloud/storage'); console.log('google cloud storage loaded')"

          echo "=== TRACE GOOGLE AUTH ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('google-auth-library'); console.log('google auth loaded')"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
