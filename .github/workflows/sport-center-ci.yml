name: Sport Center CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_TEST }}
      GCP_SECRET_ID: sport-center-test
      SUPABASE_DATABASE_URL_DEV: ${{ secrets.SUPABASE_DATABASE_URL_DEV }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deprecated dependency chain
        run: |
          echo "=== API SERVER: node-fetch ==="
          pnpm --filter @workspace/api-server why node-fetch --depth 20 || true

          echo "=== API SERVER: whatwg-url ==="
          pnpm --filter @workspace/api-server why whatwg-url --depth 20 || true

          echo "=== API SERVER: tr46 ==="
          pnpm --filter @workspace/api-server why tr46 --depth 20 || true

      - name: Check outdated API dependencies
        run: |
          echo "=== API SERVER OUTDATED ==="
          pnpm --filter @workspace/api-server outdated || true

      - name: Trace punycode dependency
        run: |
          echo "=== TRACE TESSERACT ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('tesseract.js'); console.log('tesseract loaded')"

          echo "=== TRACE GOOGLE CLOUD STORAGE ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('@google-cloud/storage'); console.log('google cloud storage loaded')"

          echo "=== TRACE GOOGLE AUTH ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('google-auth-library'); console.log('google auth loaded')"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Guard against deprecated Node punycode core module
        run: |
          if grep -Fq '__require("punycode")' artifacts/api-server/dist/bootstrap.mjs; then
            echo "ERROR: production bundle still requires deprecated Node core punycode"
            grep -n -B 4 -A 4 -F '__require("punycode")' artifacts/api-server/dist/bootstrap.mjs || true
            exit 1
          fi
          if ! grep -Fq 'punycode@2.3.1' artifacts/api-server/dist/bootstrap.mjs; then
            echo "ERROR: userland punycode is not present in production bundle"
            exit 1
          fi
          echo "PASS: production bundle uses userland punycode"
