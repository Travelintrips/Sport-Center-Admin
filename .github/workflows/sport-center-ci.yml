name: Sport Center CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_TEST }}
      GCP_SECRET_ID: sport-center-test
      SUPABASE_DATABASE_URL_DEV: ${{ secrets.SUPABASE_DATABASE_URL_DEV }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard against Replit runtime reintroduction
        run: |
          forbidden=(
            ".replit"
            ".replitignore"
            ".replit_integration_files"
            ".agents"
            "replit.md"
            "artifacts/api-server/.replit-artifact"
            "artifacts/mockup-sandbox/.replit-artifact"
            "artifacts/sport-center/.replit-artifact"
          )

          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Forbidden Replit runtime artifact is tracked: $path"
              exit 1
            fi
          done

          if git grep -n -E 'REPL_ID|REPLIT_DEV_DOMAIN|replitStorage|replit_integrations' -- \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)attached_assets/**' \
            ':(exclude).github/workflows/sport-center-ci.yml' \
            ':(exclude)*.md'; then
            echo "::error::Replit runtime coupling detected"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deprecated dependency chain
        run: |
          echo "=== API SERVER: node-fetch ==="
          pnpm --filter @workspace/api-server why node-fetch --depth 20 || true

          echo "=== API SERVER: whatwg-url ==="
          pnpm --filter @workspace/api-server why whatwg-url --depth 20 || true

          echo "=== API SERVER: tr46 ==="
          pnpm --filter @workspace/api-server why tr46 --depth 20 || true

      - name: Check outdated API dependencies
        run: |
          echo "=== API SERVER OUTDATED ==="
          pnpm --filter @workspace/api-server outdated || true

      - name: Trace punycode dependency
        run: |
          echo "=== TRACE TESSERACT ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('tesseract.js'); console.log('tesseract loaded')"

          echo "=== TRACE GOOGLE CLOUD STORAGE ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('@google-cloud/storage'); console.log('google cloud storage loaded')"

          echo "=== TRACE GOOGLE AUTH ==="
          pnpm --filter @workspace/api-server exec node \
            --trace-deprecation \
            -e "require('google-auth-library'); console.log('google auth loaded')"

      - name: Verify DEV database target and pooler credentials format
        env:
          EXPECTED_DEV_PROJECT_REF: xssrfshdrtdfupgqwfdw
        run: |
          node <<'NODE'
          const input = process.env.SUPABASE_DATABASE_URL_DEV || "";
          let url;
          try { url = new URL(input); } catch {
            console.error("::error::SUPABASE_DATABASE_URL_DEV is missing or is not a valid URL");
            process.exit(1);
          }
          const host = url.hostname;
          const user = decodeURIComponent(url.username);
          const ref = process.env.EXPECTED_DEV_PROJECT_REF;
          const expected = "postgres." + ref;
          const hostOK = host.endsWith(".pooler.supabase.com");
          const userOK = user === expected;
          const portOK = url.port === "5432" || url.port === "6543";
          if (!hostOK || !userOK || !portOK || !url.password) {
            console.error("::error::Invalid DEV database URL target / pooler user / port / missing password. Use CST-DEV pooler URL with username postgres.<DEV_PROJECT_REF>. No database secret has been printed.");
            console.log("Check only: pooler_host=" + hostOK + " dev_pooler_user=" + userOK + " port_valid=" + portOK + " password_present=" + Boolean(url.password));
            process.exit(1);
          }
          console.log("DEV database URL structure PASS (actual PostgreSQL authentication is checked by tests).");
          NODE

      - name: Verify Gym X904 admin isolation and navigation
        run: node scripts/verify-gym-x904-admin-contract.mjs

      - name: Verify concurrent public Gym guest booking lock
        run: node --test scripts/test-gym-guest-duplicate-lock.mjs

      - name: Verify Gym public bookings appear in WA Approval without unsafe paid action
        run: node --test scripts/test-wa-approval-gym-guest.mjs

      - name: Verify shared premium checkout leaves booking behavior intact
        run: node --test scripts/test-public-checkout-premium-ui.mjs

      - name: Verify public homepage links to self-booking without login
        run: node --test scripts/test-home-self-booking-cta.mjs

      - name: Verify bright split hero keeps booking safety and real building image
        run: node --test scripts/test-booking-mandiri-bright-hero.mjs

      - name: Verify booking mandiri premium presentation preserves access safety
        run: node --test scripts/test-booking-mandiri-premium-ui.mjs

      - name: Verify self-service facility choices keep Gym/X904 separate
        run: node --test scripts/test-public-facility-selector.mjs

      - name: Verify PIN and UID visible only to logged-in admin
        run: node --test scripts/test-gym-name-admin-only-pin.mjs

      - name: Verify automatic VIS reservation after official funds check
        run: node --test scripts/test-gym-vis-auto-reservation.mjs
      - name: Verify static QRIS diagnostic is read-only and reference-aware
        run: node --test scripts/test-qris-static-bank-match-dev.mjs

      - name: Verify combined Gym receipt remains pending and single-counted
        run: node --test scripts/test-gym-combined-receipt-review.mjs

      - name: Verify stale admin chunk handling and Hostinger SPA asset responses
        run: node --test scripts/test-stale-admin-chunk-recovery.mjs

      - name: Verify new X904 role-0 enrollment default-suspend safety
        run: node --test scripts/test-x904-new-user-role0-default-suspend.mjs

      - name: Verify Gym name match and visitor-card routing without public X904 grants
        run: node --test scripts/test-gym-guest-name-x904-route.mjs

      - name: Verify optional Gym PIN never becomes public machine authorization
        run: node --test scripts/test-gym-guest-optional-pin-safe.mjs

      - name: Verify public Gym self-booking without X904 access grants
        run: node --test scripts/test-gym-public-self-booking.mjs

      - name: Verify X904 ADMS safety contract
        run: |
          node scripts/verify-x904-adms-safety-contract.mjs
          node --test scripts/test-x904-adms-durable-audit.mjs
          node --test scripts/test-x904-adms-format-evidence.mjs

      - name: Verify X904 release safety contract
        run: node scripts/verify-x904-release-readiness.mjs

      - name: Verify X904 authenticated LAN sync and durable ACK
        run: |
          node scripts/verify-x904-lan-contract.mjs
          node --test scripts/test-x904-almano-snapshot.mjs
          node --test scripts/test-x904-almano-prod-snapshot.mjs
          node --test scripts/test-x904-almano-prod-autosync.mjs

      - name: Parse staged X904 durable-delete worker (no execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/x904-vmsc-durable-delete-worker-stage.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'X904_DURABLE_WORKER_POWERSHELL_PARSE_PASS'

      - name: Verify QRIS Gmail PROD detection safety contract
        run: node --test scripts/qris-mandiri/qris-prod-runtime-contract.test.mjs

      - name: Verify payroll tab creation previews and safeguards
        run: node scripts/test-sc-employee-payroll-tab-contract.mjs

      - name: Verify Kasbon salary Sheets B-to-G planner (no production writes)
        run: node --experimental-strip-types scripts/test-sc-kasbon-total-sheet-plan.mjs

      - name: Verify Kasbon Check Sync shows salary values (no production writes)
        run: node scripts/test-sc-kasbon-check-sync-display.mjs

      - name: Verify Kasbon aggregate Sync receipts and transaction badges
        run: node --experimental-strip-types scripts/test-sc-kasbon-total-sync-snapshot.mjs

      - name: Verify monthly Kasbon salary Sheets sync isolation
        run: node --experimental-strip-types scripts/test-sc-kasbon-monthly-payroll.mjs

      - name: Verify historical October and November salary employee mappings
        run: node --experimental-strip-types scripts/test-sc-kasbon-historical-robby-identity.mjs

      - name: Verify historical Kasbon summary does not fabricate transactions
        run: node scripts/test-sc-kasbon-historical-history-summary.mjs

      - name: Verify green payroll badge requires current Sheets G match
        run: node scripts/test-sc-kasbon-total-badge-live-match.mjs

      - name: Verify Sync Total disabled during Sheets checks
        run: node scripts/test-sc-kasbon-sync-button-loading.mjs

      - name: Verify Kasbon Edit and Hapus password gate
        run: node scripts/test-sc-kasbon-password-gate.mjs

      - name: Verify Kasbon create Simpan/Sync without duplicate writes
        run: node scripts/test-sc-kasbon-save-sync.mjs

      - name: Verify Kasbon POOL live SUM range expansion safety
        run: node --experimental-strip-types scripts/test-sc-kasbon-dynamic-plan.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (isolated CI suite; no live database writes)
        run: pnpm --filter @workspace/api-server run test:ci

      - name: Booking CSV regression contracts (no production access)
        run: node --test scripts/booking-csv-regression.test.mjs

      # Sport Center has no provisioned DEV application/database. Keep live DB
      # integration opt-in; all code safety/unit/type/build gates still run.
      - name: X904 database E2E (only with explicitly provisioned isolated environment)
        if: ${{ vars.SPORT_CENTER_X904_DEV_E2E_ENABLED == 'true' }}
        env:
          NODE_ENV: development
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/scripts/test-x904-e2e.ts --bundle --platform=node --format=esm --external:pg --outfile=.x904-e2e-ci.mjs
          pnpm --filter @workspace/api-server exec node .x904-e2e-ci.mjs

      - name: Build
        run: pnpm build

      - name: Guard against deprecated Node punycode core module
        run: |
          if grep -Fq '__require("punycode")' artifacts/api-server/dist/bootstrap.mjs; then
            echo "ERROR: production bundle still requires deprecated Node core punycode"
            grep -n -B 4 -A 4 -F '__require("punycode")' artifacts/api-server/dist/bootstrap.mjs || true
            exit 1
          fi

          if grep -Fq 'punycode@2.3.1' artifacts/api-server/dist/bootstrap.mjs; then
            echo "PASS: deprecated Node core punycode is absent; userland punycode is bundled where needed"
          else
            echo "PASS: production bundle has no deprecated Node core punycode dependency"
          fi

  # Real PostgreSQL fixture, completely isolated from CST-DEV and PROD.
  vis-real-postgres:
    name: VIS reservation — isolated PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vis_ci_only
          POSTGRES_DB: vis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test real PostgreSQL VIS reservation constraints
        env:
          VIS_TEST_DATABASE_URL: postgresql://postgres:vis_ci_only@127.0.0.1:5432/vis_ci
        run: node --test scripts/test-gym-vis-real-postgres.mjs

  # Runs the actual nonmember worker against disposable local PostgreSQL, never X904.
  vis-worker-real-postgres:
    name: VIS handover — actual worker isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vis_ci_only
          POSTGRES_DB: x904_nonmember_safe2
        ports:
          - 55444:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d x904_nonmember_safe2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test actual nonmember worker with collected VIS and cancelled booking
        env:
          X904_NONMEMBER_ISOLATED_PG_URL: postgresql://postgres:vis_ci_only@127.0.0.1:55444/x904_nonmember_safe2
          SUPABASE_DATABASE_URL_DEV: postgresql://postgres:vis_ci_only@127.0.0.1:55444/x904_nonmember_safe2
          NODE_ENV: test
        run: pnpm --filter @workspace/api-server test:x904-nonmember-real-pg
