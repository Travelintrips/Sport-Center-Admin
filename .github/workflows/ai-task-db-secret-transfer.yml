name: AI Task DB Secret Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and encrypt database URL
        shell: bash
        env:
          DB_URL: ${{ secrets.SUPABASE_DATABASE_URL_DEV }}
        run: |
          set -euo pipefail
          test -n "$DB_URL"
          if [[ "$DB_URL" != *"xssrfshdrtdfupgqwfdw"* ]]; then
            echo "::error::Database URL does not match expected project xssrfshdrtdfupgqwfdw."
            exit 2
          fi
          cat > public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAiA1yyMEaKT3ngdiunLo8
          Djr+ZIsTGlHrE9lB8Mo/f6VwtZjwv5qnmxynpgwtIX0NKzBvh3lXRm8yPO3sfL3/
          0sAaLZa9/IAINntAOwfxgfc/Cm01Nn9jNN8RGFqYlfU1ob3KKY4xRobrIpr+XcVP
          8fMaP3sprWcecc5ihfXSEX5nNLlm0pHb1kAj8dT9yyTbdlLjPqoNI0oSinWSNqP0
          mHlCrrlYTcM3MXgKPvsFHBUOwWZ+eOL2Q+7EbSgsP1qwgy8CtfbI38gqj73D0sqa
          VQ3yGF5SoNeMYsFxxzlCf0DL2cZFAK25GlnDRrPWOeTwjwfaDnWFt/eXMC8PRb6r
          2mtlxeVo0VC//V1gdOeD6NVCrR+HN/myl1gokfpJL62aw/ZGqbcJd3gWlesjPu8l
          dMSfuuMNZVSFWAVkvZOnFc1hhM2aLFgbflEMtRykOFEdIbgPTnWzubF6cYfb7cik
          1iyg06PAsk5wunGG58JoNOM89qsMI0W5l+tTMG9Ffa8Q9AAsiwz9RDWvk0aiYTCd
          vGzxh9wex3bTodDWszIWS2j5DCICHg0eTOGEyB4i0tNAhLbT9Tc2pn77OP2n8++t
          PKCjHESiFSebLwdnVy2qND4P9saP7xFY05/nm9AKiXEAdnGqiM248rrE0Xxxxqru
          60LBQXguHhUjEZuIoZpHDFECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$DB_URL" > secret.bin
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in secret.bin -out secret.enc
          printf 'AI_TASK_DB_CIPHERTEXT='
          base64 -w0 secret.enc
          printf '\n'
          rm -f secret.bin secret.enc public.pem