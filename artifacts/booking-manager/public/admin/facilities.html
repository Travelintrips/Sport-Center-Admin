<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasilitas — Sport Center Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <div id="sidebar-root"></div>
    <div class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:.8rem;">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <h1>Manajemen Fasilitas</h1>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openModal()">➕ Tambah Fasilitas</button>
      </div>
      <div class="admin-main">
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Fasilitas</th><th>Harga/Jam</th><th>Jam Buka</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody id="facility-table"><tr><td colspan="5" class="text-center"><div class="spinner" style="margin:.7rem auto;width:28px;height:28px;border-width:3px;"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Form -->
  <div id="form-modal" class="modal-backdrop hidden" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3 id="modal-title">Tambah Fasilitas</h3><button class="btn-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label class="form-label">Nama Fasilitas <span class="req">*</span></label>
          <input type="text" id="f-name" class="form-control" placeholder="Contoh: Lapangan Futsal A">
        </div>
        <div class="form-group">
          <label class="form-label">Deskripsi</label>
          <textarea id="f-desc" class="form-control" placeholder="Deskripsi singkat fasilitas"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Harga per Jam (Rp) <span class="req">*</span></label>
          <input type="number" id="f-price" class="form-control" placeholder="150000" min="0">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Jam Buka <span class="req">*</span></label>
            <input type="time" id="f-open" class="form-control" value="06:00">
          </div>
          <div class="form-group">
            <label class="form-label">Jam Tutup <span class="req">*</span></label>
            <input type="time" id="f-close" class="form-control" value="22:00">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">URL Gambar</label>
          <input type="url" id="f-image" class="form-control" placeholder="https://...">
        </div>
        <div class="form-group" id="active-row">
          <label class="form-label">Status</label>
          <select id="f-active" class="form-select">
            <option value="1">✅ Aktif</option>
            <option value="0">❌ Nonaktif</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveFacility()">💾 Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    async function loadFacilities() {
      try {
        const facilities = await API.get('/facilities');
        document.getElementById('facility-table').innerHTML = facilities.length
          ? facilities.map(f => `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:.8rem;">
                  ${f.image_url ? `<img src="${f.image_url}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'">` : ''}
                  <div>
                    <div class="fw-bold">${f.name}</div>
                    <div class="text-muted" style="font-size:.78rem;">${f.description || ''}</div>
                  </div>
                </div>
              </td>
              <td class="fw-bold text-primary">${formatRp(f.base_price)}</td>
              <td>${f.open_time} – ${f.close_time}</td>
              <td>${f.is_active ? '<span class="badge badge-success">Aktif</span>' : '<span class="badge badge-danger">Nonaktif</span>'}</td>
              <td style="display:flex;gap:.3rem;">
                <button class="btn btn-ghost btn-sm" onclick="editFacility(${f.id})">✏️ Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteFacility(${f.id}, '${f.name}')">🗑️</button>
              </td>
            </tr>`).join('')
          : '<tr><td colspan="5"><div class="empty-state"><div class="icon">🏟️</div><h3>Belum ada fasilitas</h3></div></td></tr>';
      } catch (e) { toast(e.message, 'danger'); }
    }

    function openModal(data = null) {
      document.getElementById('modal-title').textContent = data ? 'Edit Fasilitas' : 'Tambah Fasilitas';
      document.getElementById('edit-id').value = data ? data.id : '';
      document.getElementById('f-name').value = data?.name || '';
      document.getElementById('f-desc').value = data?.description || '';
      document.getElementById('f-price').value = data?.base_price || '';
      document.getElementById('f-open').value = data?.open_time || '06:00';
      document.getElementById('f-close').value = data?.close_time || '22:00';
      document.getElementById('f-image').value = data?.image_url || '';
      document.getElementById('f-active').value = data?.is_active !== undefined ? String(data.is_active) : '1';
      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('form-modal'))
        document.getElementById('form-modal').classList.add('hidden');
    }

    async function editFacility(id) {
      try {
        const f = await API.get(`/facilities/${id}`);
        openModal(f);
      } catch (e) { toast(e.message, 'danger'); }
    }

    async function saveFacility() {
      const id = document.getElementById('edit-id').value;
      const data = {
        name: document.getElementById('f-name').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        base_price: Number(document.getElementById('f-price').value),
        open_time: document.getElementById('f-open').value,
        close_time: document.getElementById('f-close').value,
        image_url: document.getElementById('f-image').value.trim(),
        is_active: document.getElementById('f-active').value === '1',
      };
      if (!data.name) { toast('Nama fasilitas wajib diisi', 'danger'); return; }
      if (!data.base_price) { toast('Harga wajib diisi', 'danger'); return; }
      try {
        if (id) await API.put(`/facilities/${id}`, data);
        else    await API.post('/facilities', data);
        toast(id ? 'Fasilitas diperbarui' : 'Fasilitas ditambahkan');
        closeModal();
        loadFacilities();
      } catch (e) { toast(e.message, 'danger'); }
    }

    async function deleteFacility(id, name) {
      if (!confirm(`Hapus fasilitas "${name}"?`)) return;
      try {
        await API.delete(`/facilities/${id}`);
        toast('Fasilitas dihapus');
        loadFacilities();
      } catch (e) { toast(e.message, 'danger'); }
    }

    loadFacilities();
  </script>
</body>
</html>
