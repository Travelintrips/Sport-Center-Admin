<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer — Sport Center Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <div id="sidebar-root"></div>
    <div class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:.8rem;">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <h1>Manajemen Customer</h1>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openModal()">➕ Tambah Customer</button>
      </div>
      <div class="admin-main">
        <div class="card mb-2">
          <div class="card-body" style="padding:1rem 1.2rem;">
            <div style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;">
              <div>
                <label class="form-label" style="font-size:.8rem;">Cari</label>
                <input type="text" id="search" class="form-control" placeholder="Nama / telepon / ID Card..." style="width:250px;" oninput="loadCustomers()">
              </div>
              <div>
                <label class="form-label" style="font-size:.8rem;">Tipe</label>
                <select id="filter-type" class="form-select" style="width:170px;" onchange="loadCustomers()">
                  <option value="">Semua Tipe</option>
                  <option value="umum">Customer Umum</option>
                  <option value="angkasa_pura">Angkasa Pura</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nama</th><th>Telepon</th><th>Email</th><th>Tipe</th><th>ID Card</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody id="customer-table"><tr><td colspan="7" class="text-center"><div class="spinner" style="margin:.7rem auto;width:28px;height:28px;border-width:3px;"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Form -->
  <div id="form-modal" class="modal-backdrop hidden" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3 id="modal-title">Tambah Customer</h3><button class="btn-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label class="form-label">Nama Lengkap <span class="req">*</span></label>
          <input type="text" id="f-name" class="form-control" placeholder="Nama lengkap">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Telepon</label>
            <input type="tel" id="f-phone" class="form-control" placeholder="08xx...">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="f-email" class="form-control" placeholder="email@domain.com">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Tipe Customer <span class="req">*</span></label>
          <select id="f-type" class="form-select" onchange="toggleIdCard()">
            <option value="umum">👤 Customer Umum</option>
            <option value="angkasa_pura">✈️ Angkasa Pura</option>
          </select>
        </div>
        <div id="id-card-row" class="form-group hidden">
          <label class="form-label">Nomor ID Card Angkasa Pura <span class="req">*</span></label>
          <input type="text" id="f-idcard" class="form-control" placeholder="AP-2024-XXX">
        </div>
        <div id="verified-row" class="form-group hidden">
          <label class="form-label">Status Verifikasi</label>
          <select id="f-verified" class="form-select">
            <option value="0">Belum Terverifikasi</option>
            <option value="1">Terverifikasi</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveCustomer()">💾 Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    async function loadCustomers() {
      const params = new URLSearchParams();
      const s = document.getElementById('search').value;
      const t = document.getElementById('filter-type').value;
      if (s) params.set('search', s);
      if (t) params.set('type', t);
      try {
        const customers = await API.get('/customers?' + params);
        document.getElementById('customer-table').innerHTML = customers.length
          ? customers.map(c => `<tr>
              <td class="fw-bold">${c.name}</td>
              <td>${c.phone || '-'}</td>
              <td>${c.email || '-'}</td>
              <td>${typeBadge(c.customer_type)}</td>
              <td>${c.id_card_number ? `<code>${c.id_card_number}</code>` : '<span class="text-muted">-</span>'}</td>
              <td>${c.is_verified ? '<span class="badge badge-success">✅ Terverifikasi</span>' : '<span class="badge badge-warning">⏳ Belum</span>'}</td>
              <td style="display:flex;gap:.3rem;">
                <button class="btn btn-ghost btn-sm" onclick="editCustomer(${c.id})">✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${c.id}, '${c.name}')">🗑️</button>
              </td>
            </tr>`).join('')
          : '<tr><td colspan="7"><div class="empty-state"><div class="icon">👥</div><h3>Tidak ada customer</h3></div></td></tr>';
      } catch (e) { toast(e.message, 'danger'); }
    }

    function toggleIdCard() {
      const isAP = document.getElementById('f-type').value === 'angkasa_pura';
      document.getElementById('id-card-row').classList.toggle('hidden', !isAP);
      document.getElementById('verified-row').classList.toggle('hidden', !isAP);
    }

    function openModal(data = null) {
      document.getElementById('modal-title').textContent = data ? 'Edit Customer' : 'Tambah Customer';
      document.getElementById('edit-id').value = data ? data.id : '';
      document.getElementById('f-name').value = data?.name || '';
      document.getElementById('f-phone').value = data?.phone || '';
      document.getElementById('f-email').value = data?.email || '';
      document.getElementById('f-type').value = data?.customer_type || 'umum';
      document.getElementById('f-idcard').value = data?.id_card_number || '';
      document.getElementById('f-verified').value = data?.is_verified ? '1' : '0';
      toggleIdCard();
      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('form-modal'))
        document.getElementById('form-modal').classList.add('hidden');
    }

    async function editCustomer(id) {
      try {
        const c = await API.get(`/customers/${id}`);
        openModal(c);
      } catch (e) { toast(e.message, 'danger'); }
    }

    async function saveCustomer() {
      const id = document.getElementById('edit-id').value;
      const data = {
        name: document.getElementById('f-name').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        customer_type: document.getElementById('f-type').value,
        id_card_number: document.getElementById('f-idcard').value.trim() || null,
        is_verified: document.getElementById('f-verified').value === '1',
      };
      if (!data.name) { toast('Nama wajib diisi', 'danger'); return; }
      try {
        if (id) await API.put(`/customers/${id}`, data);
        else    await API.post('/customers', data);
        toast(id ? 'Customer diperbarui' : 'Customer ditambahkan');
        closeModal();
        loadCustomers();
      } catch (e) { toast(e.message, 'danger'); }
    }

    async function deleteCustomer(id, name) {
      if (!confirm(`Hapus customer "${name}"?`)) return;
      try {
        await API.delete(`/customers/${id}`);
        toast('Customer dihapus');
        loadCustomers();
      } catch (e) { toast(e.message, 'danger'); }
    }

    loadCustomers();
  </script>
</body>
</html>
