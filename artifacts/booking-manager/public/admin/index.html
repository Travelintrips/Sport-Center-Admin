<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sport Center Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <div id="sidebar-root"></div>
    <div class="admin-content">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:.8rem;">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <h1>Dashboard</h1>
        </div>
        <div style="font-size:.85rem;color:var(--text-muted);">Halo, <strong class="admin-name"></strong> 👋</div>
      </div>
      <div class="admin-main">
        <!-- Stats -->
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card"><div class="stat-label">Total Booking</div><div class="stat-value">—</div></div>
          <div class="stat-card green"><div class="stat-label">Terverifikasi</div><div class="stat-value">—</div></div>
          <div class="stat-card yellow"><div class="stat-label">Pending</div><div class="stat-value">—</div></div>
          <div class="stat-card blue"><div class="stat-label">Booking Hari Ini</div><div class="stat-value">—</div></div>
          <div class="stat-card"><div class="stat-label">Pendapatan</div><div class="stat-value">—</div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1.2rem;" id="quick-actions">
          <a href="/admin/bookings.html?status=pending" class="card" style="padding:1.3rem;text-decoration:none;display:flex;align-items:center;gap:1rem;border:2px solid var(--warning);">
            <div style="font-size:2rem;">⏳</div>
            <div><div class="fw-bold">Verifikasi Pending</div><div class="text-muted" style="font-size:.82rem;">Booking menunggu verifikasi ID Card</div></div>
          </a>
          <a href="/booking.html" target="_blank" class="card" style="padding:1.3rem;text-decoration:none;display:flex;align-items:center;gap:1rem;border:2px solid var(--primary);">
            <div style="font-size:2rem;">➕</div>
            <div><div class="fw-bold">Booking Baru</div><div class="text-muted" style="font-size:.82rem;">Buka portal customer</div></div>
          </a>
        </div>

        <!-- Recent bookings -->
        <div class="card">
          <div class="card-header">
            <h3>📋 Booking Terbaru</h3>
            <a href="/admin/bookings.html" class="btn btn-ghost btn-sm">Lihat semua →</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Kode</th><th>Customer</th><th>Fasilitas</th><th>Tanggal</th><th>Harga</th><th>Status</th><th></th></tr></thead>
              <tbody id="recent-table"><tr><td colspan="7" class="text-center"><div class="spinner" style="margin:.5rem auto;width:24px;height:24px;border-width:3px;"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    async function loadDashboard() {
      try {
        const [stats, bookings] = await Promise.all([
          API.get('/bookings/stats'),
          API.get('/bookings?')
        ]);
        const cards = document.getElementById('stats-grid').children;
        cards[0].innerHTML = `<div class="stat-label">Total Booking</div><div class="stat-value">${stats.total}</div>`;
        cards[1].innerHTML = `<div class="stat-label">Terverifikasi</div><div class="stat-value">${stats.verified}</div>`;
        cards[2].innerHTML = `<div class="stat-label">Pending Verifikasi</div><div class="stat-value" style="color:var(--warning)">${stats.pending}</div>`;
        cards[3].innerHTML = `<div class="stat-label">Booking Hari Ini</div><div class="stat-value">${stats.today_count}</div>`;
        cards[4].innerHTML = `<div class="stat-label">Total Pendapatan</div><div class="stat-value" style="font-size:1.2rem;">${formatRp(stats.revenue)}</div>`;

        const recent = bookings.slice(0, 8);
        document.getElementById('recent-table').innerHTML = recent.length
          ? recent.map(b => `<tr>
              <td><code style="font-size:.82rem;">${b.booking_code}</code></td>
              <td><div class="fw-bold">${b.customer_name}</div><div class="text-muted" style="font-size:.78rem;">${b.customer_type === 'angkasa_pura' ? '✈️ AP' : '👤 Umum'}</div></td>
              <td>${b.facility_name}</td>
              <td>${b.booking_date}<br><span class="text-muted" style="font-size:.78rem;">${b.start_time}–${b.end_time}</span></td>
              <td>${formatRp(b.final_price)}</td>
              <td>${statusBadge(b.verification_status)}</td>
              <td>${b.verification_status === 'pending' ? `<a href="/admin/verify.html?bookingId=${b.id}" class="btn btn-warning btn-sm">🔍 Verifikasi</a>` : ''}</td>
            </tr>`).join('')
          : '<tr><td colspan="7" class="text-center text-muted" style="padding:2rem;">Belum ada booking</td></tr>';
      } catch (e) {
        toast(e.message, 'danger');
      }
    }
    loadDashboard();
  </script>
</body>
</html>
