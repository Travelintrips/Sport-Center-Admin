<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Booking — Sport Center</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><div class="logo">⚽</div> Sport Center</div>
      <div class="navbar-links">
        <a href="/">Beranda</a>
        <a href="/booking.html">Booking Baru</a>
      </div>
    </div>
  </nav>

  <div class="container page">
    <div id="loading" class="text-center"><div class="spinner"></div><p>Memuat detail booking...</p></div>
    <div id="content" class="confirmation-box hidden"></div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    async function load() {
      const code = getParam('code');
      if (!code) { window.location.href = '/'; return; }
      try {
        const b = await API.get(`/bookings/code/${code}`);
        document.getElementById('loading').classList.add('hidden');
        const isPending = b.verification_status === 'pending';
        const content = document.getElementById('content');
        content.classList.remove('hidden');
        content.innerHTML = `
          <div class="confirmation-header">
            ${isPending
              ? '<div style="font-size:2.5rem">⏳</div><h2>Booking Diterima!</h2><p style="opacity:.8;margin:.5rem 0">Menunggu verifikasi ID Card di lokasi</p>'
              : '<div style="font-size:2.5rem">🎉</div><h2>Booking Berhasil!</h2><p style="opacity:.8;margin:.5rem 0">Tunjukkan kode ini ke petugas</p>'
            }
            <div class="booking-code">${b.booking_code}</div>
          </div>
          <div class="card" style="border-radius:0 0 var(--radius) var(--radius)">
            <div class="card-body">
              ${isPending ? `<div class="alert alert-warning">
                ⚠️ <strong>Perhatian:</strong> Booking Anda berstatus <strong>Pending Verifikasi</strong>.
                Harap tunjukkan ID Card Angkasa Pura Anda kepada petugas untuk mendapatkan diskon
                <strong>${b.discount_percentage || 20}%</strong>.
                Jika tidak diverifikasi, harga penuh akan berlaku.
              </div>` : ''}
              <div class="detail-row"><span class="detail-label">Fasilitas</span><span class="detail-value">${b.facility_name}</span></div>
              <div class="detail-row"><span class="detail-label">Tanggal</span><span class="detail-value">${b.booking_date}</span></div>
              <div class="detail-row"><span class="detail-label">Waktu</span><span class="detail-value">${b.start_time} – ${b.end_time} (${b.duration_hours} jam)</span></div>
              <div class="detail-row"><span class="detail-label">Nama</span><span class="detail-value">${b.customer_name}</span></div>
              <div class="detail-row"><span class="detail-label">Telepon</span><span class="detail-value">${b.customer_phone || '-'}</span></div>
              <div class="detail-row"><span class="detail-label">Tipe Customer</span><span class="detail-value">${b.customer_type === 'angkasa_pura' ? '✈️ Angkasa Pura' : '👤 Umum'}</span></div>
              ${b.id_card_number ? `<div class="detail-row"><span class="detail-label">ID Card</span><span class="detail-value">${b.id_card_number}</span></div>` : ''}
              <div class="detail-row"><span class="detail-label">Harga Dasar</span><span class="detail-value">${formatRp(b.base_price)}</span></div>
              ${b.discount_amount > 0 ? `<div class="detail-row text-success"><span class="detail-label">Diskon ${b.discount_percentage}%</span><span class="detail-value">-${formatRp(b.discount_amount)}</span></div>` : ''}
              <div class="detail-row" style="font-size:1.1rem;font-weight:900;color:var(--primary)"><span class="detail-label">Total Bayar</span><span class="detail-value">${formatRp(b.final_price)}${isPending ? '*' : ''}</span></div>
              ${isPending ? '<p style="font-size:.78rem;color:var(--text-muted);text-align:right">* Harga belum termasuk diskon. Diskon diterapkan setelah verifikasi.</p>' : ''}
              <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${statusBadge(b.verification_status)}</span></div>
            </div>
            <div class="card-footer" style="display:flex;gap:.7rem;flex-wrap:wrap;">
              <a href="/booking.html" class="btn btn-primary">📋 Booking Lagi</a>
              <a href="/" class="btn btn-ghost">🏠 Beranda</a>
              <button onclick="window.print()" class="btn btn-ghost">🖨️ Cetak</button>
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('loading').innerHTML = `<div class="alert alert-danger">Booking tidak ditemukan: ${e.message}</div><a href="/" class="btn btn-primary mt-2">Kembali ke Beranda</a>`;
      }
    }
    load();
  </script>
</body>
</html>
