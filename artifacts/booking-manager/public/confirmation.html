<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Booking — Sport Center</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand"><div class="logo">⚽</div> Sport Center</div>
      <div class="navbar-links">
        <a href="/">Beranda</a>
        <a href="/booking.html">Booking Baru</a>
      </div>
    </div>
  </nav>

  <div class="container page">
    <div id="loading" class="text-center"><div class="spinner"></div><p>Memuat detail booking...</p></div>
    <div id="content" class="confirmation-box hidden"></div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script>
    async function load() {
      const code = getParam('code');
      if (!code) { window.location.href = '/'; return; }
      try {
        const b = await API.get(`/bookings/code/${code}`);
        document.getElementById('loading').classList.add('hidden');
        const isPending = b.verification_status === 'pending_verification';
        const content = document.getElementById('content');
        content.classList.remove('hidden');

        content.innerHTML = `
          <div class="confirmation-header">
            ${isPending
              ? '<div style="font-size:2.5rem">⏳</div><h2 style="color:#fff;">Booking Diterima!</h2><p style="opacity:.85;margin:.4rem 0 .2rem;">Status: Pending Verifikasi ID Card</p>'
              : '<div style="font-size:2.5rem">🎉</div><h2 style="color:#fff;">Booking Berhasil!</h2><p style="opacity:.85;margin:.4rem 0 .2rem;">Tunjukkan kode ini kepada petugas</p>'
            }
            <div class="booking-code">${b.booking_code}</div>
          </div>

          <div class="card" style="border-radius:0 0 var(--radius) var(--radius);">
            <div class="card-body">

              ${isPending ? `
                <!-- Instruksi penting untuk customer AP -->
                <div style="border:2px solid var(--warning);border-radius:var(--radius);padding:1.2rem;background:#fffbeb;margin-bottom:1.2rem;">
                  <div style="font-weight:900;color:#92400e;font-size:1rem;margin-bottom:.6rem;">
                    📋 Langkah Selanjutnya — Verifikasi ID Card
                  </div>
                  <ol style="color:#78350f;font-size:.88rem;line-height:2;padding-left:1.2rem;margin:0;">
                    <li>Datangi <strong>counter Sport Center</strong> sebelum atau saat jadwal booking Anda</li>
                    <li>Tunjukkan kode booking <strong>${b.booking_code}</strong> kepada petugas</li>
                    <li>Petugas akan <strong>scan QR/barcode ID Card</strong> Angkasa Pura Anda</li>
                    <li>Jika valid, <strong>diskon otomatis diterapkan</strong> dan harga akan diperbarui</li>
                    <li>Anda akan mendapatkan konfirmasi harga akhir setelah verifikasi</li>
                  </ol>
                </div>` : ''}

              <div class="detail-row"><span class="detail-label">Fasilitas</span><span class="detail-value">${b.facility_name}</span></div>
              <div class="detail-row"><span class="detail-label">Tanggal</span><span class="detail-value">${b.booking_date}</span></div>
              <div class="detail-row"><span class="detail-label">Waktu</span><span class="detail-value">${b.start_time} – ${b.end_time} (${b.duration_hours} jam)</span></div>
              <div class="detail-row"><span class="detail-label">Nama</span><span class="detail-value">${b.customer_name}</span></div>
              <div class="detail-row"><span class="detail-label">Telepon</span><span class="detail-value">${b.customer_phone || '-'}</span></div>
              <div class="detail-row"><span class="detail-label">Tipe Customer</span><span class="detail-value">${b.customer_type === 'angkasa_pura' ? '✈️ Angkasa Pura' : '👤 Umum'}</span></div>
              ${b.id_card_number ? `<div class="detail-row"><span class="detail-label">ID Card</span><span class="detail-value"><code>${b.id_card_number}</code></span></div>` : ''}

              <div class="detail-row"><span class="detail-label">Harga Dasar</span><span class="detail-value">${formatRp(b.base_price)}</span></div>
              ${b.discount_amount > 0 ? `<div class="detail-row text-success"><span class="detail-label">Diskon ${b.discount_percentage}%</span><span class="detail-value">-${formatRp(b.discount_amount)}</span></div>` : ''}

              <div class="detail-row" style="font-size:1.05rem;font-weight:900;color:var(--primary)">
                <span class="detail-label">Total Bayar${isPending ? ' *' : ''}</span>
                <span class="detail-value">${formatRp(b.final_price)}</span>
              </div>
              ${isPending ? `<p style="font-size:.78rem;color:var(--text-muted);text-align:right;margin-top:.3rem;">* Harga penuh sebelum diskon. Diskon diterapkan setelah verifikasi ID Card.</p>` : ''}

              <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${statusBadge(b.verification_status)}</span></div>
            </div>
            <div class="card-footer" style="display:flex;gap:.7rem;flex-wrap:wrap;">
              <a href="/booking.html" class="btn btn-primary">📋 Booking Lagi</a>
              <a href="/" class="btn btn-ghost">🏠 Beranda</a>
              <button onclick="window.print()" class="btn btn-ghost">🖨️ Cetak</button>
            </div>
          </div>`;
      } catch (e) {
        document.getElementById('loading').innerHTML =
          `<div class="alert alert-danger">Booking tidak ditemukan: ${e.message}</div>
           <a href="/" class="btn btn-primary mt-2">Kembali ke Beranda</a>`;
      }
    }
    load();
  </script>
</body>
</html>
